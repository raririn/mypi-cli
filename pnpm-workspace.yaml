  protobufjs: set this to true or false

linkWorkspacePackages: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - canvas
  - esbuild
  - protobufjs

overrides:
  '@smithy/types': 4.15.1
  protobufjs: 7.6.5
